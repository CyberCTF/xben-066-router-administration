# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-066-24 Router Administration (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a router administration panel (Flask, MySQL) behind a chain of an outdated HAProxy and mitmproxy, with an internal device service behind it.
# The benchmark folder benchmarks/XBEN-066-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/hrs-admin-router/app/, built by its own Dockerfiles; the overlay in build/hrs-admin-router/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-066-router-administration

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.109.0/24, internet: false }

machines:
  db:
    networks: { lab: 10 }
    services: [{ port: 3306, name: mysql }]
    resources: { cpus: 1, memory_mb: 1024 }
    docker:
      build: build/db

  haproxy:
    networks: { lab: 20 }
    services: [{ port: 8001, name: web, http: true }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [mitmproxy]
    docker:
      build: build/haproxy

  mitmproxy:
    networks: { lab: 30 }
    services: [{ port: 8002, name: web, http: true, publish: 8002 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [hrs-admin-router]
    docker:
      build: build/mitmproxy

  hrs-admin-router:
    networks: { lab: 40 }
    services: [{ port: 80, name: web, http: true }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [db]
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/hrs-admin-router
      init: [ctf/flag.sh]

checks:
  - name: the Router Administration page answers
    http: http://mitmproxy:8002/login
    wait: 180
  - name: a wrong login is refused through the proxy chain
    script: checks/probe.sh
    wait: 60

message: |
  Router Administration answers at http://localhost:{{ machines.mitmproxy.services.0.publish }}/.
  A router admin panel behind two proxies. Outdated proxies can disagree on where a request ends.
